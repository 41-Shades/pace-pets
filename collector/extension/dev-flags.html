<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pace Pets Dev Controls</title>
    <link rel="stylesheet" href="./dev-flags.css" />
    <link rel="stylesheet" href="./dev-flags-current-mode.css" />
  </head>
  <body>
    <main class="dev-flags-shell">
      <header class="dev-flags-header">
        <p class="eyebrow">Local unpacked extension</p>
        <h1>Pace Pets Dev Controls</h1>
      </header>

      <div class="dev-controls-layout">
        <section class="current-mode-panel" aria-live="polite">
          <div class="current-mode-summary" id="current-mode-summary">
            <output
              class="current-mode-status"
              id="status-message"
              role="status"
            ></output>
          </div>
          <button class="live-data-button" id="reset-all" type="button" hidden>
            Return to live data
          </button>
        </section>

        <section class="state-columns" aria-label="State override">
          <div class="state-overrides-row">
            <section
              class="state-column state-column-wrap-options"
              aria-labelledby="pace-levels-title"
            >
              <h2 id="pace-levels-title">Pace Levels</h2>
              <div class="option-list" id="pace-level-list"></div>
            </section>

            <section
              class="state-column state-column-wrap-options"
              aria-labelledby="special-states-title"
            >
              <h2 id="special-states-title">Special States</h2>
              <div class="state-subsection">
                <h3 class="state-subsection-title">Perfect</h3>
                <div class="option-list" id="perfect-state-list"></div>
              </div>
              <div class="state-subsection">
                <h3 class="state-subsection-title">Imperfect</h3>
                <div class="option-list" id="imperfect-state-list"></div>
              </div>
            </section>
          </div>

          <div class="state-preview-row">
            <section
              class="state-column"
              aria-labelledby="singularity-entry-title"
            >
              <h2 id="singularity-entry-title">Singularity Entry</h2>
              <div class="state-subsection">
                <h3 class="state-subsection-title">Transition Preview</h3>
                <p class="state-subsection-note">
                  Start from any non-Singularity state.
                </p>
                <div
                  class="option-list"
                  id="singularity-transition-preview-list"
                ></div>
              </div>
            </section>

            <section
              class="state-column state-column-wrap-options"
              aria-labelledby="sprint-intensity-title"
            >
              <h2 id="sprint-intensity-title">Sprint Intensity</h2>
              <div class="option-list" id="sprint-intensity-preview-list"></div>
            </section>

            <section
              class="state-column state-column-wrap-options"
              aria-labelledby="other-previews-title"
            >
              <h2 id="other-previews-title">Other Previews</h2>
              <div class="option-list" id="feature-preview-list"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script src="./runtime-manifest.js"></script>
    <script src="./dev-flags-loader.js"></script>
  </body>
</html>
